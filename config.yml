api:
  url: "https://archive-api.open-meteo.com/v1/archive"
  latitude: 51.493847
  longitude: -0.1630249
  start_date: "2019-01-01"
  end_date: "2024-01-31"
  variable: "temperature_2m"
  app_api_url: "http://localhost:8000"
  # http://api:8000

paths:
  raw_data:        ./data/raw_temperature.csv
  processed_data:  ./data/processed_temperature.csv
  db_path:         ./data/weather.db
  model_path:      ./models/lstm_multi.keras
  scaler_path:     ./models/scaler.pkl 

data:
  resample_freq: "3h"
  test_size:     744         # 31 * 3 * 8 => environ 3mois 
  n_splits:      4

model:
  name:         "lstm_multioutput_v2"
  lookback:     24
  horizon:      24
  lstm_units_l1: 128
  lstm_units_l2: 64
  dropout:      0.2
  batch_size:   32
  epochs:       50
  lr: 0.0005  


mlflow:
  experiment_name: "temperature_forecast"
  tracking_uri:   "mlruns"  
