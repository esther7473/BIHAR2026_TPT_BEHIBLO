api:
  url: "https://archive-api.open-meteo.com/v1/archive"
  latitude: 51.5085
  longitude: -0.1257
  start_date: "2019-01-01"
  end_date: "2024-01-31"
  variable: "temperature_2m"

paths:
  raw_data: ./data/raw_temperature.csv
  processed_data: ./data/processed_temperature.csv
  db_path:         ./data/weather.db   


data:
  resample_freq: "3h"
  test_size: 0.2
  n_splits: 5

model:
  lookback: 24
  n_units: 64
  dropout: 0.2
  batch_size: 32
  epochs: 100
  learning_rate: 0.001

arima:
  order: [3, 0, 2]

sarima:
  order: [3, 0, 2]
  seasonal_order: [2, 0, 2, 4]