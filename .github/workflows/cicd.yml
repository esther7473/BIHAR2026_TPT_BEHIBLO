name: CI/CD Pipeline

on:
  push:
    branches: [dev]   

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Set up Python
        run: |
          python --version 

      - name: Install dependencies
        run: pip install -r requirements/serving.txt

      - name: Run tests
        run: pytest src/test/unit/ -v

  # ── 2. Merge dev → main ───────────────────
  merge:
    runs-on: ubuntu-latest
    needs: tests   
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge dev into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git merge dev --no-ff -m "ci: merge dev into main"
          git push origin main

  # ── 3. Versioning ─────────────────────────
  versioning:
    runs-on: ubuntu-latest
    needs: merge
    outputs:
      version: ${{ steps.get_sha.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   

      - name: Get commit SHA
        id: get_sha
        run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: versioning
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: serving
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.versioning.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

