name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install dependencies
        run: |
          pip install -r requirements/serving.txt
          pip install -r requirements/test.txt

      - name: Run unit tests
        run: python -m pytest src/test/unit/ -v
          --ignore=src/test/unit/test_train.py
          --ignore=src/test/unit/test_inference.py
          --ignore=src/test/unit/test_preprocessing.py

      - name: Run integration tests
        run:  python -m pytest src/test/integration/ -v

  merge:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git fetch --unshallow

      - name: Merge dev into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git merge origin/dev --no-ff -m "ci: merge dev into main"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

  # ── 3. Versioning ─────────────────────────
  versioning:
    runs-on: ubuntu-latest
    needs: merge
    outputs:
      version: ${{ steps.get_sha.outputs.version }}
    steps:
      - name: Checkout main
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout main

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "version=$SHA" >> $GITHUB_OUTPUT
          echo "Version : $SHA"

  # ── 4. Build & Push image serving ─────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: versioning
    steps:
      - name: Checkout main
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout main

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build serving image
        run: |
          docker build \
            --target serving \
            -t ghcr.io/${{ github.repository }}:${{ needs.versioning.outputs.version }} \
            -t ghcr.io/${{ github.repository }}:latest \
            .

      - name: Push serving image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ needs.versioning.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest