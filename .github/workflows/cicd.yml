name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:

  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_sha.outputs.version }}
    steps:
      - name: Get commit SHA
        id: get_sha
        run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Run unit tests
        run: |
          python -m pytest src/test/unit/ -v 

  # ── 3. Build & Push (attend versioning + unit-tests) ───────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: [versioning, unit-tests]
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Set lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build serving image
        run: |
          docker build \
            --target serving \
            -t ghcr.io/${{ github.repository }}:${{ needs.versioning.outputs.version }} \
            -t ghcr.io/${{ github.repository }}:latest \
            .

      - name: Push serving image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ needs.versioning.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest

  # ── 4. Integration tests (attend build) ────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Start API container
        run: |
          docker run -d \
            --name weather-api \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:latest

      - name: Wait for API to be ready
        run: |
          for i in {1..10}; do
            curl -s http://localhost:8000/ && break
            echo "Waiting for API... attempt $i"
            sleep 3
          done

      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run integration tests
        run: python -m pytest src/test/integration/ -v

      - name: Stop container
        if: always()
        run: |
          docker stop weather-api
          docker rm weather-api

  # ── 5. Merge dev → main (tout est OK) ──────────────────────────
  merge:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git fetch --unshallow || git fetch --all

      - name: Merge dev into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git merge origin/dev --no-ff -m "ci: merge dev into main"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main