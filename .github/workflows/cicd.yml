name: CI/CD Pipeline

on:
  push:
    branches: [dev]


jobs:

  versioning:

  # 24.04 est la dernière version LTS
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_sha.outputs.version }}
    steps:
       - name: Checkout
         uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5

       - name: Get commit SHA
         id: get_sha
         run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5
        with:
          ref: ${{ github.sha }}

      
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/test.txt

      - name: Verify installation
        # shell: bash
        run: python3 --version

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Run unit tests
        run: python -m pytest src/test/unit/ -v 


  build-and-push:
      runs-on: ubuntu-24.04
      needs: [versioning, unit-tests]

      permissions:
         contents: read
         packages: write
      steps:

        - name: Checkout
          uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5
          with:
            ref: ${{ github.sha }}

        - name: Set lowercase repository name
          id: repo
          run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT


        - name: Log in to GHCR
          run: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

        - name: Build serving image
          run: |
            docker build \
              --target serving \
              --build-arg GIT_SHA=${{ github.sha }} \
              -t ghcr.io/${{ steps.repo.outputs.name }}:${{ needs.versioning.outputs.version }}  .

        - name: Push serving image
          run: |
            docker push ghcr.io/${{ steps.repo.outputs.name }}:${{ needs.versioning.outputs.version }}
  
 
  integration-tests:
    runs-on: ubuntu-24.04
    needs: [build-and-push, versioning]  
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Set lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Start API container
        run: |
          docker run -d \
            --name weather-api \
            -p 8000:8000 \
            ghcr.io/${{ steps.repo.outputs.name }}:${{ needs.versioning.outputs.version }} 

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8000/docs; then
              echo "API is ready!"
              exit 0
            fi
            echo "Waiting for API... attempt $i/15"
            sleep 3
          done
          echo "API did not start in time"
          docker logs weather-api
          exit 1

      - name: Checkout
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5
        with:
            ref: ${{ github.sha }}
            
      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run integration tests
        run: python -m pytest src/test/integration/ -v

      - name: Show app logs on failure
        if: failure()
        run: docker logs weather-api   

      - name: Stop container
        if: always()
        run: |
          docker stop weather-api
          docker rm weather-api

  merge:
    runs-on: ubuntu-24.04
    needs: build-and-push
    steps:
      
      - name: Checkout
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5
        with:
            ref: ${{ github.sha }}


      - name: Merge dev into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git merge origin/dev --no-ff -m "ci: merge dev into main"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main